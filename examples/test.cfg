bind x quit
bind 'x' quit
bind "x" quit
bind "x" "quit"

set x 10
set x "10"
set foo $bar
set bar %health
set bar "{$health}"

alias multi "
    echo hello;
    echo world
"

bind q "weapon 7 5 3 2 1"
bind q "+fire 7 5 3 2 1"

alias cool_zoom "fov %1; sensitivity %2; v_viewheight %3; crosshaircolor %5";
cool_zoom 30 3.2 -6 79

alias zoom "set_calc fov $fov * %1; set_calc sensitivity $sensitivity * %1"
bind "capslock" "zoom 0.5"

alias foo "if (x and y) then say we are sane and powerupped!"

alias bar   "if ('$tp_name_rl' isin '$bestweapon') then __check_gear_%1; wait; .%1"
alias foo   "if ($health + 20 > 100) then foo else bar"

// set nick based on name
alias _.nick.name       "if_exists alias _.nick.$name _.nick.$name _.not"

tp_name_ring  "{&cff0ring&cfff}"

set_tp tvs_nick_color	"{&cf3f xan&cfff}"


