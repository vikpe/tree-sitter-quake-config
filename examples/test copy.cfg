alias bar       "if ('$tp_name_rl' isin '$bestweapon') then __check_gear_%1; wait; .%1"
alias foo       "if ($health > 100) then foo else bar"


unbindall
connect quake.se:28501
place gameclock screen
place "gameclock" screen
place $foo $bar
+showscores

hud_ammo1_align_x right
hud_ammo1_align_x   right
hud_ammo1_align_x   "right"
hud_ammo1_align_x   $my_var
hud_ammo1_align_x   "$my_var" // great

set foo 5
set foo -5
set foo "-5"
set foo "4on4 on 4"
set foo $bar
set foo $bar    // great

alias mmm "if ($a==1 and $b == '2' or $c == $3) then x else if ($x or $w) then foo else bar"
alias mmm "if ($a==1 and $b == '2' or $c != $3) x else if ($x or $w) foo"

set_tp tvs_loc  "$[{%l}$]; if you say so. or lets play endif gg"

alias foo "if $health > 100 then foo else bar"
alias foo "__foo; say one or two! if not three!; if ($health > 100) then foo else bar"
alias wait3 "wait; wait; wait"
alias redteam "team red; color 4 4"

alias maybe "if $tp_name_rl isin $bestweapons then x else $y"
alias maybe "if ('a' or 'b') then x else if '%b' then y else if '$c' then z else w"
alias maybe "if ('$tp_name_rl' isin '$bestweapon') then x else y"

alias foo "echo %health"
alias cool_zoom "fov %1; sensitivity %2; v_viewheight %3; crosshaircolor %5";
cool_zoom 30 3.2 -6 79

echo %health
echo $health

sensitivity 5
sensitivity $new_sens

alias __dead    "if ('$matchtype' == '2on2') then .lost else if ('$weapon' == '$tp_name_lg') then .left_pack lg- else if ('$weapon' == '$tp_name_rl') then .left_pack rl- else .lost"
alias __alive   "if ('%1' isin 'report safe sync') then __check_gear_%1; wait; .%1"

alias __point   "__shownick; if ('$point' != '$tp_name_nothing' AND '$ledpoint' != '$G') then .point"

tp_name_enemy			"{&cf00enemy&cfff}"
tp_name_eyes			"eyes"
tp_name_someplace		" "
tp_name_at				"at"
tp_name_separator		"$x20"

// binds
bind mouse1  forward
bind mouse1  "forward"
bind mouse1  "+forward"
bind mouse1  "-forward"
